<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::title}, ~{::section})">

<head>
    <title>Booking</title>
</head>

<section>

    <!-- Title -->
    <div class="mb-8">
        <h2 class="text-3xl font-bold">Booking Management</h2>
        <p class="text-gray-400">Create and manage your bookings</p>
    </div>

    <!-- CREATE BOOKING FORM -->
    <div class="bg-gray-800 p-6 rounded-xl shadow-lg mb-10">
        <h3 class="text-xl font-semibold mb-4">Create Booking</h3>

        <form method="post" action="/booking/create" class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <input type="text" name="bookingId" placeholder="Booking ID" required
                   class="p-3 rounded-lg bg-gray-700 text-white">

            <input type="hidden" name="userId" th:value="${currentUserId}">
            <input type="text" th:value="${currentUserId}" disabled
                   class="p-3 rounded-lg bg-gray-600 text-gray-400 cursor-not-allowed">

            <select name="roomId" required
                    class="p-3 rounded-lg bg-gray-700 text-white">
                <option value="" disabled selected>Select a Room</option>
                <th:block th:each="room : ${availableRooms}">
                    <option th:value="${room.roomId}"
                            th:text="${room.roomId} + ' — ' + ${room.type} + ' ($' + ${room.price} + ')'">
                    </option>
                </th:block>
            </select>

            <input type="date" name="date" required
                   class="p-3 rounded-lg bg-gray-700 text-white">

            <button type="submit"
                    class="col-span-1 md:col-span-2 bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-semibold">
                Create Booking
            </button>

        </form>
    </div>

    <!-- VIEW BOOKINGS -->
    <div class="bg-gray-800 p-6 rounded-xl shadow-lg">
        <h3 class="text-xl font-semibold mb-4">All Bookings</h3>

        <table class="w-full text-left">
            <thead class="bg-gray-700">
            <tr>
                <th class="p-3">Booking ID</th>
                <th class="p-3">User ID</th>
                <th class="p-3">Room ID</th>
                <th class="p-3">Date</th>
                <th class="p-3">Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="booking : ${bookings}" class="border-b border-gray-600">

                <td class="p-3" th:text="${booking.bookingId}"></td>
                <td class="p-3" th:text="${booking.userId}"></td>
                <td class="p-3" th:text="${booking.roomId}"></td>
                <td class="p-3" th:text="${booking.date}"></td>

                <td class="p-3">
                    <form method="post" action="/booking/cancel">
                        <input type="hidden" name="bookingId" th:value="${booking.bookingId}">
                        <button class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded">
                            Cancel
                        </button>
                    </form>
                </td>

            </tr>
            </tbody>
        </table>

    </div>

</section>

</html>
