<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">

<head>
    <title th:replace="${title}">Hotel System</title>

    <!-- This is Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

<!-- This is the navigation bar -->
<nav class="bg-gray-800 shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

        <!-- This is the Logo -->
        <h1 class="text-xl font-bold text-white">
            Hotel System
        </h1>

        <!-- These are the Navigation Links -->
        <div class="space-x-6">
            <a href="/" class="hover:text-blue-400">Home</a>
            <a href="/rooms" class="hover:text-blue-400">Rooms</a>
            <a href="/booking" class="hover:text-blue-400">Booking</a>
            <a href="/admin" class="hover:text-blue-400">Admin</a>
            <a href="/logout" class="text-red-400 hover:text-red-500">Logout</a>
        </div>

    </div>
</nav>

<!-- This is the main content -->
<main class="max-w-7xl mx-auto px-6 py-10">
    <div th:replace="${content}"></div>
</main>

<!-- footer -->
<footer class="bg-gray-800 mt-10">
    <div class="max-w-7xl mx-auto px-6 py-4 text-center text-gray-400">
        © 2026 Hotel Reservation System
    </div>
</footer>

</body>
</html>
