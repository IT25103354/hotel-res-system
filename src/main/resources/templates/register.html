<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::title}, ~{::section})">

<head>
  <title>Register</title>
</head>

<section class="flex justify-center items-center min-h-[70vh]">

  <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md">

    <!-- Title -->
    <h2 class="text-2xl font-bold text-center mb-6">
      Create an Account
    </h2>

    <!-- Error Message -->
    <div th:if="${error}"
         class="bg-red-500 text-white p-3 rounded mb-4 text-center">
      <span th:text="${error}"></span>
    </div>

    <!-- Form -->
    <form method="post" action="/register" class="space-y-4">

      <!-- User ID -->
      <input type="text"
             name="userId"
             placeholder="User ID"
             required
             class="w-full p-3 rounded-lg bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">

      <!-- Name -->
      <input type="text"
             name="name"
             placeholder="Full Name"
             required
             class="w-full p-3 rounded-lg bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">

      <!-- Email -->
      <input type="email"
             name="email"
             placeholder="Email"
             required
             class="w-full p-3 rounded-lg bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">

      <!-- Password -->
      <input type="password"
             name="password"
             placeholder="Password"
             required
             class="w-full p-3 rounded-lg bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">

      <!-- Role -->
      <select name="role"
              class="w-full p-3 rounded-lg bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="Guest">Guest</option>
        <option value="Admin">Admin</option>
      </select>

      <!-- Button -->
      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-semibold transition">
        Register
      </button>

    </form>

    <!-- Login Redirect -->
    <p class="text-gray-400 text-center mt-4">
      Already have an account?
      <a href="/login" class="text-blue-400 hover:underline">
        Login
      </a>
    </p>

  </div>

</section>

</html>
