<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/"
      th:replace="layout :: layout(~{::title}, ~{::section})">

<head>
    <title>Rooms</title>
</head>

<section>

    <div class="max-w-7xl mx-auto px-6 pt-10 pb-8">
        <h2 class="text-3xl font-bold text-white" style="font-family: 'Georgia', serif;">Available Rooms</h2>
        <p class="text-gray-300" style="font-family: 'Georgia', serif;">Browse all rooms in the system</p>
    </div>

    <div class="max-w-7xl mx-auto px-6 pb-16">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <div th:each="room : ${rooms}"
                 class="bg-white bg-opacity-10 backdrop-blur-md border border-white border-opacity-20 p-6 rounded-xl shadow-lg">

                <h3 class="text-xl font-semibold mb-2 text-white"
                    style="font-family: 'Georgia', serif;"
                    th:text="'Room ID: ' + ${room.roomId}">
                </h3>

                <p class="text-gray-300 mb-1"
                   style="font-family: 'Georgia', serif;"
                   th:text="'Type: ' + ${room.type}">
                </p>

                <p class="text-gray-300 mb-1"
                   style="font-family: 'Georgia', serif;"
                   th:text="'Price: $' + ${room.price}">
                </p>

                <p class="mb-4"
                   style="font-family: 'Georgia', serif;"
                   th:text="${room.available} ? 'Available' : 'Not Available'"
                   th:classappend="${room.available} ? 'text-green-400' : 'text-red-400'">
                </p>

                <a th:if="${room.available}" href="/booking"
                   class="block text-center bg-blue-600 hover:bg-blue-700 p-2 rounded-lg transition"
                   style="font-family: 'Georgia', serif;">
                    Book Room
                </a>

                <p th:unless="${room.available}"
                   class="block text-center bg-white bg-opacity-10 text-gray-400 p-2 rounded-lg cursor-not-allowed"
                   style="font-family: 'Georgia', serif;">
                    Not Available
                </p>

            </div>

        </div>
    </div>

</section>
</html>
