<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/"
      th:replace="layout :: layout(~{::title}, ~{::section})">

<head>
    <title>Rooms</title>
</head>

<section>

    <!-- Title -->
    <div class="mb-8">
        <h2 class="text-3xl font-bold">Available Rooms</h2>
        <p class="text-gray-400">Browse all rooms in the system</p>
    </div>

    <!-- Room Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <!-- Room Card -->
        <div th:each="room : ${rooms}"
             class="bg-gray-800 p-6 rounded-xl shadow-lg">

            <h3 class="text-xl font-semibold mb-2"
                th:text="'Room ID: ' + ${room.roomId}">
            </h3>

            <p class="text-gray-400 mb-1"
               th:text="'Type: ' + ${room.type}">
            </p>

            <p class="text-gray-400 mb-1"
               th:text="'Price: $' + ${room.price}">
            </p>

            <p class="mb-4"
               th:text="${room.available} ? 'Available' : 'Not Available'"
               th:classappend="${room.available} ? 'text-green-400' : 'text-red-400'">
            </p>

            <!-- Book Button -->
            <a href="/booking"
               class="block text-center bg-blue-600 hover:bg-blue-700 p-2 rounded-lg">
                Book Room
            </a>

        </div>

    </div>

</section>

</html>
