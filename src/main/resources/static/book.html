<!DOCTYPE html>
<html>
<head>
    <title>Book Room</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">
    <h2>Book a Room</h2>

    <form action="/book" method="post">
        <input type="text" name="bookingId" placeholder="Booking ID" required>

    </form>
