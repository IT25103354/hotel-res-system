<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<h1>Hotel Reservation System</h1>

<div class="container">
    <h2>Admin Dashboard</h2>

    <!-- Add Room -->
    <div class="section">
        <h3>Add Room</h3>
        <form action="/admin/rooms/add" method="post">
            <input type="text" name="roomId" placeholder="Room ID" required>
            <input type="text" name="type" placeholder="Room Type" required>
            <input type="number" name="price" placeholder="Price" required>
            <input type="text" name="available" placeholder="true or false" required>
            <button type="submit">Add Room</button>
        </form>
    </div>

    <!-- Delete User -->
    <div class="section">
        <h3>Delete User</h3>
        <form action="/admin/users/delete" method="post">
            <input type="text" name="userId" placeholder="User ID" required>
            <button type="submit">Delete User</button>
        </form>
    </div>

    <!-- Users Table -->
    <div class="section">
        <h3>Users</h3>
        <table>
            <tr>
                <th>User ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
            </tr>

            <tr th:each="u : ${users}">
                <td th:text="${u.split(',')[0]}"></td>
                <td th:text="${u.split(',')[1]}"></td>
                <td th:text="${u.split(',')[2]}"></td>
                <td th:text="${u.split(',')[4]}"></td>
            </tr>
        </table>
    </div>

    <!-- Rooms Table -->
    <div class="section">
        <h3>Rooms</h3>
        <table>
            <tr>
                <th>Room ID</th>
                <th>Type</th>
                <th>Price</th>
                <th>Available</th>
            </tr>

            <tr th:each="room : ${rooms}">
                <td th:text="${room.split(',')[0]}"></td>
                <td th:text="${room.split(',')[1]}"></td>
                <td th:text="${room.split(',')[2]}"></td>
                <td th:text="${room.split(',')[3]}"></td>
            </tr>
        </table>
    </div>

    <!-- Bookings Table -->
    <div class="section">
        <h3>Bookings</h3>
        <table>
            <tr>
                <th>Booking ID</th>
                <th>User ID</th>
                <th>Room ID</th>
                <th>Date</th>
                <th>Status</th>
            </tr>

            <tr th:each="b : ${bookings}">
                <td th:text="${b.split(',')[0]}"></td>
                <td th:text="${b.split(',')[1]}"></td>
                <td th:text="${b.split(',')[2]}"></td>
                <td th:text="${b.split(',')[3]}"></td>
                <td th:text="${b.split(',')[4]}"></td>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
